; RNDISStorage — USB network gadget (NCM) + WebDAV on T-Dongle-S3
; No USB Mass Storage. No Wi-Fi SoftAP.
; Windows sees a USB Ethernet adapter; device serves HTTP at 203.0.113.1

[platformio]
default_envs = t-dongle-s3
description = RNDISStorage USB-NCM WebDAV PoC

[env:t-dongle-s3]
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_upload.maximum_size = 16777216

build_flags =
	-DRNDISSTORAGE_DEVICE_NAME=\"TTGO-T-Dongle-S3\"
	-DRNDISSTORAGE_PROTOCOL_VERSION=\"2.1\"
	-DRNDISSTORAGE_IP_ADDR=\"203.0.113.1\"
	-DRNDISSTORAGE_HTTP_PORT=80
	-DRNDISSTORAGE_MAX_PATH=200
	-DRNDISSTORAGE_MAX_FILE_SIZE=536870912
	-DRNDISSTORAGE_TRANSPORT_USBNET=1

monitor_speed = 115200
upload_speed = 921600

; Flash tip: hold BOOT while re-plugging if COM port missing; after flash unplug 2s and replug.
