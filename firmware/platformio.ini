; RNDISStorage — USB NCM + SoftAP + WebDAV on T-Dongle-S3
; No USB Mass Storage.
; Windows: USB Ethernet → http://203.0.113.1/
; SoftAP:  SSID RNDISStorage → http://192.168.4.1/

[platformio]
default_envs = t-dongle-s3
description = RNDISStorage USB-NCM + SoftAP WebDAV PoC

[env:t-dongle-s3]
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_upload.maximum_size = 16777216

build_flags =
	-DRNDISSTORAGE_DEVICE_NAME=\"TTGO-T-Dongle-S3\"
	-DRNDISSTORAGE_PROTOCOL_VERSION=\"2.4\"
	-DRNDISSTORAGE_IP_ADDR=\"203.0.113.1\"
	-DRNDISSTORAGE_HOST_IP_ADDR=\"203.0.113.2\"
	-DRNDISSTORAGE_WIFI_IP_ADDR=\"192.168.4.1\"
	-DRNDISSTORAGE_WIFI_SSID=\"RNDISStorage\"
	-DRNDISSTORAGE_WIFI_PASS=\"rndis-lab\"
	-DRNDISSTORAGE_WIFI_CHANNEL=6
	-DRNDISSTORAGE_SOCKS_PORT=1080
	-DRNDISSTORAGE_HTTP_PORT=80
	-DRNDISSTORAGE_MAX_PATH=200
	-DRNDISSTORAGE_MAX_FILE_SIZE=536870912
	-DRNDISSTORAGE_IO_CHUNK=16384
	-DRNDISSTORAGE_TRANSPORT_USBNET=1

monitor_speed = 115200
upload_speed = 921600

; Flash tip: hold BOOT while re-plugging if COM port missing; after flash unplug 2s and replug.
